name: Release Plugin

# Pushing a tag like v3.0.0.0 builds the plugin for both supported ABIs, attaches
# the zips to a GitHub Release and refreshes manifest.json with the matching
# checksums, so the repository URL can be added straight to Jellyfin.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v3.0.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: "Build packages"
        run: |
          chmod +x build.sh
          ./build.sh net9.0
          ./build.sh net10.0

      - name: "Publish GitHub Release"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Repository : $REPO"
          echo "Tag        : $TAG"
          gh --version

          shopt -s nullglob
          PACKAGES=(dist/*.zip)
          shopt -u nullglob

          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo "::error::No packages found in dist/, nothing to release"
            exit 1
          fi
          echo "Packages to upload:"
          printf '  %s\n' "${PACKAGES[@]}"

          # Create the release if it does not exist yet. Idempotent, so re-runs work.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
          fi

          # Upload (or replace) the packages. The asset upload endpoint is
          # occasionally flaky, so retry a few times before giving up.
          attempt=1
          until gh release upload "$TAG" "${PACKAGES[@]}" --repo "$REPO" --clobber; do
            if [ "$attempt" -ge 5 ]; then
              echo "::error::Failed to upload release assets after $attempt attempts"
              exit 1
            fi
            echo "Asset upload failed (attempt $attempt), retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done

          # Never report success unless every package is attached to the release:
          # a silently skipped upload would leave Jellyfin with a manifest that
          # points at a 404.
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "Assets currently attached to the release:"
          echo "$ASSETS"

          status=0
          for pkg in "${PACKAGES[@]}"; do
            name=$(basename "$pkg")

            if ! grep -qx "$name" <<< "$ASSETS"; then
              echo "::error::Asset $name is missing from the release"
              status=1
              continue
            fi

            # Verify the asset is actually downloadable without credentials,
            # exactly how Jellyfin will fetch it from the manifest.
            url="https://github.com/$REPO/releases/download/$TAG/$name"
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "$url")
            echo "download check: $name -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::Asset $name is not downloadable (HTTP $code) at $url"
              status=1
            fi
          done
          exit $status

      - name: "Update manifest.json"
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          for TFM in net9.0 net10.0; do
            case "$TFM" in
              net9.0)  ABI="10.11.0.0" ;;
              net10.0) ABI="12.0.0.0" ;;
            esac
            ZIP=$(ls dist/*-"$TFM".zip | head -1)
            python3 tools/update-manifest.py \
              --manifest manifest.json \
              --zip "$ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --tag "$TAG" \
              --tfm "$TFM" \
              --target-abi "$ABI" \
              --changelog "Jellyfin 10.11 and 12 support"
          done

      - name: "Commit manifest.json"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json already up to date"
          else
            git commit -m "Update plugin manifest for ${{ github.event.inputs.tag || github.ref_name }}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
