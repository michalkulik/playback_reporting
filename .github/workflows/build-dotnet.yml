name: Test Build Plugin

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          # .NET 10 SDK builds both the net9.0 and the net10.0 target.
          dotnet-version: "10.0.x"

      - name: "Restore"
        run: dotnet restore

      - name: "Build"
        run: dotnet build --configuration Release --no-restore

      - name: "Package (net9.0 - Jellyfin 10.11 and 12)"
        run: |
          chmod +x build.sh
          ./build.sh net9.0

      - name: "Package (net10.0 - Jellyfin 12)"
        run: ./build.sh net10.0

      - name: "Upload packages"
        uses: actions/upload-artifact@v4
        with:
          name: playback-reporting-packages
          path: dist/*.zip
